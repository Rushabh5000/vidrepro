name: vidrepro

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vidrepro
      POSTGRES_PASSWORD: vidrepro
      POSTGRES_DB: vidrepro
    ports: ["5433:5432"]  # host 5433 to avoid clashing with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidrepro"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/vidrepro || true"

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    env_file: .env
    ports: ["3010:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: infra/docker/worker.Dockerfile }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["9100:9100"]   # worker Prometheus metrics

  web:
    build:
      context: ./web
      dockerfile: ../infra/docker/web.Dockerfile
      args: { NEXT_PUBLIC_API_URL: "http://localhost:3010" }
    ports: ["3009:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
